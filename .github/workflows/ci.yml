# Gates de toda mudança: lint, formatação, tipagem e testes (unitários e estruturais).
# O banco do CI é vazio: recebe os papéis e as migrações, mas não a carga (a base bruta
# tem 3,4 GB). O teste de integração com dados reais roda localmente, com o compose.
name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: bi_owner
          POSTGRES_PASSWORD: ci_owner
          POSTGRES_DB: bi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bi_owner -d bi"
          --health-interval 3s
          --health-retries 20
    env:
      DATABASE_URL_ETL: postgresql://bi_etl:ci_etl@localhost:5432/bi
      DATABASE_URL_APP: postgresql://bi_app:ci_app@localhost:5432/bi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Lint e formatação
        run: ruff check app etl analise tests && ruff format --check app etl analise tests
      - name: Tipagem
        run: mypy
      - name: Papéis e migrações do banco
        env:
          PGHOST: localhost
          PGPASSWORD: ci_owner
          POSTGRES_USER: bi_owner
          POSTGRES_DB: bi
          BI_ETL_PASSWORD: ci_etl
          BI_APP_PASSWORD: ci_app
        run: |
          sh db/init/001_roles.sh
          python -c "import os, psycopg; from etl.carga import aplicar_migracoes; aplicar_migracoes(psycopg.connect(os.environ['DATABASE_URL_ETL'], autocommit=True))"
      - name: Testes
        run: pytest -q
