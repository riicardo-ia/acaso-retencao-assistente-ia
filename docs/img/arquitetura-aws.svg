<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" role="img" aria-label="Arquitetura na AWS">
  <title>Arquitetura na AWS</title>
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6b7280"/></marker></defs>
  <rect width="1080" height="470" fill="#ffffff"/>
  <!-- VPC -->
  <rect x="250" y="20" width="560" height="430" rx="14" fill="#fafafa" stroke="#a1a1aa" stroke-dasharray="6 5"/>
  <text x="266" y="42" fill="#6b7280" font-weight="600">VPC (rede privada da conta)</text>
  <rect x="270" y="56" width="520" height="80" rx="10" fill="#f6f7f9" stroke="#e5e7eb"/>
  <text x="284" y="74" fill="#6b7280" font-size="11.5">sub-rede pública</text>
  <rect x="270" y="150" width="520" height="285" rx="10" fill="#f6f7f9" stroke="#e5e7eb"/>
  <text x="284" y="168" fill="#6b7280" font-size="11.5">sub-redes privadas (sem acesso direto da internet)</text>

