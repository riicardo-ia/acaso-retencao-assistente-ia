    <rect x="860" y="340" width="200" height="50" rx="10" fill="#f6f7f9" stroke="#a1a1aa"/>
  </g>
  <g text-anchor="middle" fill="#121212">
    <text x="105" y="94" font-weight="600">Pessoa do cliente</text><text x="105" y="112" fill="#6b7280">navegador</text>
    <text x="105" y="184" font-weight="600">CloudFront + S3</text><text x="105" y="202" fill="#6b7280">página (HTML, JS, CSS)</text>
    <text x="105" y="274" font-weight="600">Cognito</text><text x="105" y="292" fill="#6b7280">login do cliente</text>
    <text x="530" y="98" font-weight="600">ALB</text><text x="530" y="115" fill="#6b7280">entrada HTTPS da API</text>
    <text x="400" y="214" font-weight="600">ECS Fargate: API</text><text x="400" y="232" fill="#6b7280">FastAPI, só leitura</text>
    <text x="660" y="214" font-weight="600">ECS Fargate: carga</text><text x="660" y="232" fill="#6b7280">e temas, pelo EventBridge</text>
    <text x="530" y="354" font-weight="600">RDS PostgreSQL</text><text x="530" y="372" fill="#6b7280">base analítica (schema mart)</text>
    <text x="960" y="82" font-weight="600">S3: base bruta</text><text x="960" y="99" fill="#6b7280">privado, só a carga lê</text>
    <text x="960" y="152" font-weight="600">Bedrock</text><text x="960" y="169" fill="#6b7280">LLM da classificação</text>
    <text x="960" y="222" font-weight="600">Secrets Manager</text><text x="960" y="239" fill="#6b7280">senhas e sal</text>
    <text x="960" y="292" font-weight="600">CloudWatch</text><text x="960" y="309" fill="#6b7280">logs, métricas, alarmes</text>
    <text x="960" y="362" font-weight="600">ECR</text><text x="960" y="379" fill="#6b7280">imagens do CI</text>
  </g>
