<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 270" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" role="img" aria-label="Fluxo da base bruta até a tela">
  <title>Arquitetura: da base bruta até a tela</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1060" height="270" fill="#ffffff"/>
  <rect x="560" y="92" width="490" height="118" rx="14" fill="none" stroke="#6a48eb" stroke-dasharray="6 5"/>
  <text x="805" y="230" text-anchor="middle" fill="#583ecb">o dashboard só enxerga a base analítica (nunca a base bruta)</text>

  <g fill="#f6f7f9" stroke="#a1a1aa">
    <rect x="10" y="110" width="130" height="80" rx="10"/>
    <rect x="185" y="110" width="140" height="80" rx="10"/>
    <rect x="370" y="110" width="170" height="80" rx="10"/>
    <rect x="390" y="10" width="130" height="58" rx="10"/>
  </g>
  <g fill="#efebfd" stroke="#6a48eb">
